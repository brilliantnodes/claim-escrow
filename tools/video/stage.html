<body>
<svg width="0" height="0" style="position:absolute"><defs id="defs"></defs></svg>
<div id="s"></div>
<script>
const S = document.getElementById("s");
let D = null, W = 1920, H = 1080, U = 1;
const C = { ink: "#0F1A3A", teal: "#22B8A7", mauve: "#8A6CE0", amber: "#F2B13E", rose: "#EA6A86", paper: "#F4EFE2", text: "#EEF1FA", muted: "#A9B3D1" };

// Guilloché bands: r(t) = R0 + a·sin(k·t + φ), several phase-shifted copies per band.
function ring(R0, a, k, phase, steps = 1440) {
  let s = "";
  for (let i = 0; i <= steps; i++) {
    const t = (i / steps) * 2 * Math.PI;
    const r = R0 + a * Math.sin(k * t + phase) + a * 0.35 * Math.sin((k / 2) * t - phase * 2);
    s += (i ? "L" : "M") + (r * Math.cos(t)).toFixed(1) + " " + (r * Math.sin(t)).toFixed(1);
  }
  return s + "Z";
}
const BANDS = [
  { R0: 290, a: 26, k: 48, n: 7, color: C.teal },
  { R0: 205, a: 32, k: 32, n: 7, color: C.mauve },
  { R0: 128, a: 28, k: 20, n: 6, color: C.amber },
  { R0: 58, a: 22, k: 12, n: 5, color: C.rose },
];
function buildDefs() {
  let html = "";
  BANDS.forEach((b, bi) => {
    let paths = "";
    for (let j = 0; j < b.n; j++) paths += `<path d="${ring(b.R0, b.a, b.k, (j / b.n) * (Math.PI * 2 / b.k) * 2.2)}" pathLength="1"/>`;
    html += `<symbol id="band${bi}" viewBox="-340 -340 680 680" overflow="visible"><g fill="none" stroke="${b.color}" stroke-width="1.3">${paths}</g></symbol>`;
  });
  // small seal: two bands
  let seal = "";
  for (let j = 0; j < 6; j++) seal += `<path d="${ring(84, 12, 24, j * 0.09, 720)}" pathLength="1"/>`;
  for (let j = 0; j < 5; j++) seal += `<path d="${ring(52, 12, 14, j * 0.14, 720)}" pathLength="1"/>`;
  html += `<symbol id="seal" viewBox="-110 -110 220 220" overflow="visible"><g fill="none" stroke-width="1.6">${seal}</g></symbol>`;
  // faint background waves
  let waves = "";
  for (let j = 0; j < 9; j++) {
    let s = "";
    for (let i = 0; i <= 240; i++) { const x = i * 10 - 100; const y = 820 + j * 26 + 34 * Math.sin(i / 18 + j * 0.5) + 14 * Math.sin(i / 7 - j); s += (i ? "L" : "M") + x + " " + y.toFixed(1); }
    waves += `<path d="${s}"/>`;
  }
  html += `<symbol id="waves" viewBox="0 0 2200 1200" overflow="visible"><g fill="none" stroke="rgba(169,179,209,.10)" stroke-width="1.4">${waves}</g></symbol>`;
  document.getElementById("defs").innerHTML = html;
}
async function setup(w, h, data) {
  W = w; H = h; D = data; U = h / 1080;
  S.style.width = w + "px"; S.style.height = h + "px";
  S.style.setProperty("--u", U + "px");
  buildDefs();
  await Promise.all([document.fonts.load("600 40px Fraunces"), document.fonts.load("600 40px InterV"), document.fonts.load("400 40px InterV"), document.fonts.load("700 40px InterV")]);
  for (const src of [D.shot]) await new Promise((r) => { const im = new Image(); im.onload = im.onerror = r; im.src = src; });
}
const clamp = (x) => Math.max(0, Math.min(1, x));
const ease = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const easeOutBack = (x) => { x = clamp(x); const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const seg = (t, a, b) => ease((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const px = (n) => (n * U) + "px";
const op = (t, a, b) => `opacity:${seg(t, a, b)}`;
const rise = (t, a, b, d = 26) => `opacity:${seg(t, a, b)};transform:translateY(${px((1 - seg(t, a, b)) * d)})`;
const topbar = () => `<div class="top"><b>ClaimEscrow</b><span>on GenLayer</span></div>`;
const cap = (text, t, dur, color = C.teal) => `<div class="cap" style="border-left-color:${color};opacity:${seg(t, .2, .6) * (1 - seg(t, dur - .35, dur))}">${text}</div>`;
const waves = (t) => `<svg class="abs" style="left:0;top:0" width="${W}" height="${H}" viewBox="0 0 1920 1080"><use href="#waves" x="${-60 + t * 14}" y="-10" width="2200" height="1200"/></svg>`;
function rosette(size, t, drawStart, drawLen, extra = "") {
  let uses = "";
  BANDS.forEach((b, i) => {
    const k = seg(t, drawStart + i * 0.22, drawStart + i * 0.22 + drawLen);
    uses += `<use href="#band${i}" x="-340" y="-340" width="680" height="680" style="stroke-dasharray:1 1;stroke-dashoffset:${(1 - k).toFixed(4)}"/>`;
  });
  return `<svg width="${px(size)}" height="${px(size)}" viewBox="-340 -340 680 680" style="overflow:visible;${extra}">${uses}</svg>`;
}
function seal(size, color, k, extra = "") {
  return `<svg width="${px(size)}" height="${px(size)}" viewBox="-110 -110 220 220" style="overflow:visible;${extra}"><g stroke="${color}"><use href="#seal" x="-110" y="-110" width="220" height="220" style="stroke-dasharray:1 1;stroke-dashoffset:${(1 - k).toFixed(4)}"/></g></svg>`;
}
const gaugeArc = (cx, cy, r, v0, v1, vmax, color, w) => {
  const a0 = Math.PI * (1 - v0 / vmax), a1 = Math.PI * (1 - v1 / vmax);
  const x0 = cx + r * Math.cos(a0), y0 = cy - r * Math.sin(a0), x1 = cx + r * Math.cos(a1), y1 = cy - r * Math.sin(a1);
  return `<path d="M${x0} ${y0} A${r} ${r} 0 0 1 ${x1} ${y1}" stroke="${color}" stroke-width="${w}" fill="none"/>`;
};
function gauge(cx, cy, r, vmax, zones, value, limit, limitLabel, tickStep, fmt) {
  let g = "";
  zones.forEach(([a, b, c]) => { g += gaugeArc(cx, cy, r, a, b, vmax, c, r * 0.13); });
  for (let v = 0; v <= vmax + 1e-9; v += tickStep) {
    const a = Math.PI * (1 - v / vmax);
    g += `<text x="${cx + (r * 0.78) * Math.cos(a)}" y="${cy - (r * 0.78) * Math.sin(a) + r * 0.03}" fill="${C.muted}" font-size="${r * 0.075}" font-family="InterV" text-anchor="middle">${fmt(v)}</text>`;
  }
  const la = Math.PI * (1 - limit / vmax);
  g += `<line x1="${cx + r * 0.9 * Math.cos(la)}" y1="${cy - r * 0.9 * Math.sin(la)}" x2="${cx + r * 1.12 * Math.cos(la)}" y2="${cy - r * 1.12 * Math.sin(la)}" stroke="#fff" stroke-width="${r * 0.016}"/>`;
  g += `<text x="${cx + r * 1.2 * Math.cos(la)}" y="${cy - r * 1.2 * Math.sin(la)}" fill="#fff" font-size="${r * 0.08}" font-family="InterV" font-weight="600" text-anchor="middle">${limitLabel}</text>`;
  const na = Math.PI * (1 - Math.min(value, vmax) / vmax);
  g += `<line x1="${cx}" y1="${cy}" x2="${cx + r * 0.86 * Math.cos(na)}" y2="${cy - r * 0.86 * Math.sin(na)}" stroke="#fff" stroke-width="${r * 0.028}" stroke-linecap="round"/>`;
  g += `<circle cx="${cx}" cy="${cy}" r="${r * 0.06}" fill="#fff"/>`;
  return g;
}
const browser = (url, w, h, inner, transform) => `<div class="browser" style="width:${px(w)};transform:${transform};transform-origin:50% 50%"><div class="bb"><i></i><i></i><i></i><span>${url}</span></div><div class="shot" style="height:${px(h)}">${inner}</div></div>`;

const gen = (w) => (Number(BigInt(w || "0") / 10n ** 14n) / 10000).toFixed(2);
// a case's amount: two decimals while it counts up, then exact (3.825, not 3.83), so seller + buyer adds up to the escrow on screen
const amt = (v, k) => (k < 1 ? (v * k).toFixed(2) : (Math.round(v * 1000) % 10 === 0 ? v.toFixed(2) : v.toFixed(3)));
const REG = (rows, hl, extra = "") => `<div class="paper abs" style="${extra}">
  <div style="background:#22334d;color:#fff;padding:${px(16)} ${px(26)};border-radius:${px(10)} ${px(10)} 0 0"><div style="font-weight:700;font-size:${px(26)}">Marrowgate Restructuring Agents</div><div style="font-size:${px(16)};opacity:.75">Claims and noticing agent (fictional)</div></div>
  <div style="padding:${px(18)} ${px(30)} ${px(24)}"><div class="serif" style="font-size:${px(30)};font-weight:600">Pellmoor Freight Lines, Inc. · Claim No. 1042</div>
  ${rows.map(([k, v], i) => `<div style="display:flex;gap:${px(18)};border-top:1px solid #d9d2bd;padding:${px(13)} 0;font-size:${px(24)}"><span style="width:${px(230)};color:#5a6576;flex:none">${k}:</span><span style="font-weight:600;${hl[i] ? `background:rgba(242,177,62,${hl[i]});border-radius:${px(6)};padding:0 ${px(8)}` : ""}">${v}</span></div>`).join("")}</div></div>`;
const typed = (t, s, a, b) => s.slice(0, Math.round(s.length * clamp((t - a) / (b - a))));
const SELLER = "Quenby Tool &amp; Die LLC", BUYER = "Harrowfield Credit Partners LP";

const SCENES = {
  title(t, dur) {
    const tilt = lerp(50, 36, seg(t, 0, dur));
    const glow = `<div class="abs" style="left:${px(1010)};top:${px(170)};width:${px(780)};height:${px(780)};border-radius:50%;background:radial-gradient(circle, rgba(34,184,167,.26), rgba(138,108,224,.14) 45%, transparent 70%)"></div>`;
    const ros = `<div class="abs" style="left:${px(1020)};top:${px(180)};width:${px(760)};height:${px(760)};perspective:${px(1500)}"><div style="transform:rotateX(${tilt}deg) rotateZ(${t * 14}deg);transform-style:preserve-3d">${rosette(760, t, 0.05, 1.5)}</div></div>`;
    const text = `<div class="abs" style="left:${px(140)};top:${px(270)};width:${px(880)}"><div class="lede" style="${rise(t, .15, .6)}">ClaimEscrow, on GenLayer</div>
      <div class="h" style="font-size:${px(82)};margin-top:${px(22)};${rise(t, .35, 1.0, 34)}">The safer way to buy and sell bankruptcy claims.</div>
      <div style="font-size:${px(30)};color:${C.amber};font-weight:600;margin-top:${px(30)};${rise(t, .8, 1.3)}">claims.brilliantnodes.com</div>
      <div class="muted" style="font-size:${px(22)};margin-top:${px(14)};${op(t, 1.0, 1.4)}">Fictional case and names · test GEN only</div></div>`;
    return waves(t) + glow + ros + text;
  },
  problem(t, dur) {
    const head = `<div class="abs h" style="left:${px(120)};top:${px(130)};width:${px(1500)};font-size:${px(60)};${rise(t, .1, .5)}">The price is paid now. The claim's worth is decided later.</div>`;
    const person = (x, label, color) => `<div class="abs" style="left:${px(x - 30)};top:${px(420)};width:${px(320)};text-align:center"><svg width="${px(150)}" height="${px(150)}" viewBox="-60 -60 120 120"><circle r="56" fill="${color}" opacity=".18"/><circle cy="-14" r="20" fill="${color}"/><path d="M-34 40 a34 30 0 0 1 68 0" fill="${color}"/></svg><div style="font-size:${px(30)};font-weight:700;margin-top:${px(8)}">${label}</div></div>`;
    const crack = seg(t, 2.2, 2.8);
    const link = `<svg class="abs" style="left:0;top:0" width="${W}" height="${H}" viewBox="0 0 1920 1080">
      <path d="M520 500 C 700 ${470 - crack * 40}, 760 ${470 - crack * 60}, ${930 - crack * 30} ${500 - crack * 30}" stroke="${crack > .5 ? C.rose : C.amber}" stroke-width="8" fill="none" stroke-dasharray="18 12" stroke-dashoffset="${-t * 40}" opacity="${seg(t, .5, .9)}"/>
      <path d="M${990 + crack * 30} ${500 - crack * 30} C 1160 ${470 - crack * 60}, 1220 ${470 - crack * 40}, 1400 500" stroke="${crack > .5 ? C.rose : C.amber}" stroke-width="8" fill="none" stroke-dasharray="18 12" stroke-dashoffset="${t * 40}" opacity="${seg(t, .5, .9)}"/>
      <text x="960" y="${450 - crack * 50}" fill="${crack > .5 ? C.rose : C.amber}" font-size="34" font-family="Fraunces" font-weight="600" text-anchor="middle" opacity="${seg(t, .7, 1.0)}">${crack > .5 ? "trust breaks here" : "trust"}</text></svg>`;
    const cards = `<div class="abs" style="left:${px(160)};top:${px(720)};width:${px(1600)};display:flex;gap:${px(40)}">
      <div class="panel" style="position:relative;flex:1;border-top-color:${C.rose};${rise(t, 1.0, 1.4)}"><div class="pt">The buyer pays in full</div><div class="ps" style="font-size:${px(24)}">and chases a refund if the claim is later cut or rejected.</div></div>
      <div class="panel" style="position:relative;flex:1;border-top-color:${C.amber};${rise(t, 1.4, 1.8)}"><div class="pt">The buyer holds part back</div><div class="ps" style="font-size:${px(24)}">and the seller waits, trusting the buyer to pay it.</div></div></div>`;
    return waves(t) + head + person(330, "Seller (a supplier)", C.teal) + person(1360, "Buyer (an investor)", C.mauve) + link + cards;
  },
  register(t, dur) {
    const trans = `${BUYER} as transferee of ${SELLER}`;
    const flip = 1.6, dec = 3.6;
    const holder = t < flip ? SELLER : typed(t, trans, flip, flip + 1.0);
    const status = t < dec ? "Pending" : "Allowed";
    const allowed = t < dec + .4 ? "–" : "$1,250,000.00";
    const hl = [0, t > flip ? .55 * (1 - seg(t, flip + 1.4, flip + 2.2)) + .15 : 0, 0, t > dec ? .55 : 0, t > dec + .4 ? .55 : 0];
    const card = REG([["Claim No.", "1042"], ["Creditor", holder], ["Claim amount", "$1,250,000.00"], ["Status", status], ["Allowed amount", allowed]], hl,
      `left:${px(120)};top:${px(260)};width:${px(1180)};transform:perspective(${px(2000)}) rotateY(${lerp(14, 8, seg(t, 0, dur))}deg);${op(t, 0, .4)}`);
    const chips = [["Transfer filed (Rule 3001(e))", flip], ["Court decision", dec]];
    let right = `<div class="abs" style="left:${px(1370)};top:${px(300)};width:${px(440)}"><div class="h" style="font-size:${px(50)};${rise(t, .2, .7)}">The facts are public.</div>`;
    chips.forEach(([c, at], i) => { right += `<div class="chip" style="opacity:${seg(t, at, at + .3)};border-left-color:${i ? C.amber : C.teal}"><span>${c}</span></div>`; });
    right += `<div class="muted" style="font-size:${px(22)};margin-top:${px(18)};line-height:1.4;${op(t, .8, 1.2)}">The claims agent's register shows who holds the claim, its status and its allowed amount.</div></div>`;
    return waves(t) + card + right + cap("A page made for people, with no feed a contract can use.", t, dur, C.teal);
  },
  validators(t, dur) {
    const cx = 960, cy = 560, rx = 640, ry = 230;
    const card = REG([["Creditor", `${BUYER} as transferee of ${SELLER}`], ["Status", "Allowed"], ["Allowed amount", "$1,250,000.00"]], [0, 0, 0],
      `left:${px(cx - 400)};top:${px(cy - 170)};width:${px(800)};transform:scale(.82);transform-origin:50% 50%;${op(t, 0, .4)}`);
    const nodes = [{ a: 200, c: C.teal }, { a: 320, c: C.mauve }, { a: 20, c: C.amber }, { a: 140, c: C.rose }, { a: 260, c: "#5fb3ff" }];
    let lines = "", seals = "";
    nodes.forEach((n, i) => {
      const ang = (n.a + t * 6) * Math.PI / 180;

      const sz = lerp(110, 170, depth);
      const st = 1.3 + i * 0.45;
      const done = t > st;
      const k = seg(t, 0.2 + i * 0.12, 1.3 + i * 0.12);
      lines += `<line x1="${x}" y1="${y}" x2="${cx}" y2="${cy}" stroke="${done ? n.c : "rgba(169,179,209,.35)"}" stroke-width="${done ? 4 : 2}" stroke-dasharray="10 10" stroke-dashoffset="${-t * 50}" opacity="${seg(t, .3, .8)}"/>`;
      const stamp = done ? `<circle r="${lerp(0, 46, seg(t, st, st + .25))}" fill="${n.c}"/><path d="M-20 2 L-6 16 L22 -14" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="${seg(t, st + .15, st + .35)}"/>` : "";
      seals += `<div class="abs" style="left:${px(x - sz / 2)};top:${px(y - sz / 2)};width:${px(sz)};height:${px(sz)};z-index:${depth > .5 ? 5 : 1}">${seal(sz, n.c, k, "position:absolute;left:0;top:0")}<svg class="abs" style="left:0;top:0" width="${px(sz)}" height="${px(sz)}" viewBox="-110 -110 220 220">${stamp}</svg></div>`;
    });
    const svg = `<svg class="abs" style="left:0;top:0" width="${W}" height="${H}" viewBox="0 0 1920 1080"><ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="rgba(169,179,209,.18)" stroke-width="2"/>${lines}</svg>`;
    const head = `<div class="abs" style="left:${px(120)};top:${px(112)};width:${px(1600)}"><div class="h" style="font-size:${px(52)};${rise(t, .1, .5)}">The model copies. Code decides.</div>
      <div class="muted" style="font-size:${px(24)};margin-top:${px(10)};${op(t, 3.4, 3.8)}">Each label must start its line; the whole status is looked up in a closed table; agreement is exact on holder, status and amount.</div></div>`;
    return waves(t) + svg + card + seals + head + cap("Anything unclear, such as “Allowed for voting purposes only”, moves nothing.", t, dur, C.mauve);
  },
  twice(t, dur) {
    const x0 = 260, x1 = 1660, y1 = 470, y2 = 720;
    const X = (k) => lerp(x0, x1, k);
    const dot = (x, y, c, k, label, sub) => `<g opacity="${k}"><circle cx="${x}" cy="${y}" r="${18 * easeOutBack(k)}" fill="${c}" stroke="#fff" stroke-width="4"/><text x="${x}" y="${y - 34}" fill="#fff" font-size="26" font-family="InterV" font-weight="600" text-anchor="middle">${label}</text><text x="${x}" y="${y + 52}" fill="${C.muted}" font-size="20" font-family="InterV" text-anchor="middle">${sub}</text></g>`;
    const bracket = (xa, xb, y, k, txt) => `<g opacity="${k}"><path d="M${xa} ${y + 80} L${xa} ${y + 96} L${xb} ${y + 96} L${xb} ${y + 80}" stroke="${C.amber}" stroke-width="3" fill="none"/><text x="${(xa + xb) / 2}" y="${y + 126}" fill="${C.amber}" font-size="21" font-family="InterV" text-anchor="middle">${txt}</text></g>`;
    let g = `<line x1="${x0}" y1="${y1}" x2="${x0 + (x1 - x0) * seg(t, .2, 1.2)}" y2="${y1}" stroke="rgba(169,179,209,.4)" stroke-width="3"/><line x1="${x0}" y1="${y2}" x2="${x0 + (x1 - x0) * seg(t, .3, 1.3)}" y2="${y2}" stroke="rgba(169,179,209,.4)" stroke-width="3"/>`;
    g += `<text x="${x0 - 30}" y="${y1 + 8}" fill="${C.teal}" font-size="28" font-family="Fraunces" font-weight="600" text-anchor="end">Transfer</text><text x="${x0 - 30}" y="${y2 + 8}" fill="${C.amber}" font-size="28" font-family="Fraunces" font-weight="600" text-anchor="end">Decision</text>`;
    g += dot(X(.08), y1, C.teal, seg(t, 1.0, 1.3), "buyer seen", "1st look") + dot(X(.36), y1, C.teal, seg(t, 1.8, 2.1), "seen again", "10 min later") + bracket(X(.08), X(.36), y1, seg(t, 1.9, 2.2), "confirm_seconds apart");
    g += `<g opacity="${seg(t, 2.2, 2.5)}"><rect x="${X(.36) + 40}" y="${y1 - 26}" width="300" height="52" rx="26" fill="${C.teal}"/><text x="${X(.36) + 190}" y="${y1 + 9}" fill="#06231f" font-size="24" font-family="InterV" font-weight="700" text-anchor="middle">upfront to the seller</text></g>`;
    g += dot(X(.62), y2, C.amber, seg(t, 2.9, 3.2), "Allowed", "1st look") + dot(X(.9), y2, C.amber, seg(t, 3.7, 4.0), "Allowed", "seen again") + bracket(X(.62), X(.9), y2, seg(t, 3.8, 4.1), "confirm_seconds apart");
    const head = `<div class="abs" style="left:${px(120)};top:${px(130)};width:${px(1500)}"><div class="h" style="font-size:${px(60)};${rise(t, .1, .5)}">Nothing moves on one look.</div>
      <div class="muted" style="font-size:${px(26)};margin-top:${px(12)};${op(t, .4, .8)}">Each reading counts at its own time stamp. The seller holding the claim again also counts only when seen twice.</div></div>`;
    return waves(t) + `<svg class="abs" style="left:0;top:0" width="${W}" height="${H}" viewBox="0 0 1920 1080">${g}</svg>` + head + cap("A withdrawal pays the seller only after the buyer was shown holding the claim live.", t, dur, C.amber);
  },
  escrow(t, dur) {
    const price = 7.5, up = 3.75;
    const x0 = 260, w = 1400, y = 470;
    const kUp = seg(t, 2.4, 3.1), kRest = seg(t, 4.5, 5.2);
    const seller = up * kUp + (price - up) * kRest;
    const lockedW = w * (1 - seller / price);
    let g = `<rect x="${x0}" y="${y}" width="${w}" height="70" rx="35" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.2)"/>`;
    g += `<rect x="${x0}" y="${y}" width="${w * seller / price}" height="70" rx="35" fill="${C.teal}"/>`;
    g += `<rect x="${x0 + w * seller / price}" y="${y}" width="${lockedW}" height="70" rx="35" fill="${C.mauve}" opacity=".75"/>`;
    g += `<text x="${x0}" y="${y - 24}" fill="${C.teal}" font-size="30" font-family="Fraunces" font-weight="600">seller ${seller.toFixed(2)} GEN</text>`;
    g += `<text x="${x0 + w}" y="${y - 24}" fill="${C.mauve}" font-size="30" font-family="Fraunces" font-weight="600" text-anchor="end">in escrow ${(price - seller).toFixed(2)} GEN</text>`;
    const step = (x, k, a, b) => `<g opacity="${k}"><text x="${x}" y="${y + 130}" fill="#fff" font-size="28" font-family="InterV" font-weight="600" text-anchor="middle">${a}</text><text x="${x}" y="${y + 166}" fill="${C.muted}" font-size="22" font-family="InterV" text-anchor="middle">${b}</text></g>`;
    g += step(x0 + w * .25, seg(t, 2.3, 2.7), "Transfer confirmed", "upfront: 50% of the price") + step(x0 + w * .75, seg(t, 4.4, 4.8), "Allowed at $1,250,000", "the price for that amount");
    const alts = `<div class="abs" style="left:${px(260)};top:${px(780)};width:${px(1400)};display:flex;gap:${px(30)}">
      ${[["Disallowed", "the seller keeps the upfront; the rest back to the buyer", C.rose], ["Allowed at 80%", "the price for $1,000,000; the buyer gets the rest", C.amber], ["Withdrawn before the buyer held it", "everything back to the buyer", C.mauve]].map(([a, b, c], i) =>
        `<div class="panel" style="position:relative;flex:1;border-top-color:${c};padding:${px(18)} ${px(22)};${rise(t, 4.9 + i * .2, 5.3 + i * .2)}"><div class="pt" style="font-size:${px(28)}">${a}</div><div class="ps" style="font-size:${px(20)}">${b}</div></div>`).join("")}</div>`;
    const head = `<div class="abs h" style="left:${px(120)};top:${px(150)};width:${px(1500)};font-size:${px(58)};${rise(t, .1, .5)}">The whole price sits in escrow: 7.50 GEN.</div>`;
    return waves(t) + head + `<svg class="abs" style="left:0;top:0" width="${W}" height="${H}" viewBox="0 0 1920 1080">${g}</svg>` + alts;
  },
  cases(t, dur) {
    let cards = "";
    D.cases.forEach((c, i) => {
      const k = seg(t, .5 + i * .45, 1.4 + i * .45);
      const ps = c.escrow > 0 ? c.seller / c.escrow : 0, pb = c.escrow > 0 ? c.buyer / c.escrow : 0;
      cards += `<div class="panel" style="position:relative;border-top-color:${ps >= .99 ? C.teal : pb >= .99 ? C.mauve : C.amber};padding:${px(16)} ${px(20)};${rise(t, .3 + i * .45, .7 + i * .45, 18)}">
        <div class="pt" style="font-size:${px(25)}">${c.title}</div><div class="ps" style="font-size:${px(17)}">Claim ${c.claim}</div>
        <div style="height:${px(16)};border-radius:${px(8)};background:rgba(255,255,255,.1);overflow:hidden;display:flex;margin:${px(12)} 0 ${px(8)}"><span style="width:${ps * k * 100}%;background:${C.teal}"></span><span style="width:${pb * k * 100}%;background:${C.mauve}"></span></div>
        <div style="font-size:${px(19)}"><span style="color:${C.teal};font-weight:600">seller ${amt(c.seller, k)}</span> · <span style="color:#c7b8ff;font-weight:600">buyer ${amt(c.buyer, k)}</span> <span class="muted">of ${c.escrow.toFixed(2)} GEN</span></div></div>`;
    });
    const grid = `<div class="abs" style="left:${px(120)};top:${px(215)};width:${px(1680)};display:grid;grid-template-columns:1fr 1fr 1fr;gap:${px(18)} ${px(28)}">${cards}</div>`;
    const head = `<div class="abs" style="left:${px(120)};top:${px(110)};width:${px(1680)};display:flex;justify-content:space-between;align-items:baseline"><div class="h" style="font-size:${px(54)};${rise(t, .05, .4)}">${D.cases.length} fictional cases, live on ${D.net}</div><div class="num" style="font-size:${px(40)};color:${C.amber};${op(t, .3, .7)}">${Math.round(D.n_tx * seg(t, .3, 2.0))} transactions</div></div>`;
    return waves(t) + head + grid + cap(`Contract ${D.contract.slice(0, 10)}… · every outcome summed exactly to its escrow`, t, dur, C.teal);
  },
  deadlines(t, dur) {
    const x0 = 220, x1 = 1700, y = 560, X = (k) => lerp(x0, x1, k);
    let g = `<line x1="${x0}" y1="${y}" x2="${x0 + (x1 - x0) * seg(t, .2, 1.2)}" y2="${y}" stroke="rgba(169,179,209,.45)" stroke-width="4"/>`;
    const mark = (k, label, sub, c, at) => `<g opacity="${seg(t, at, at + .3)}"><line x1="${X(k)}" y1="${y - 40}" x2="${X(k)}" y2="${y + 40}" stroke="${c}" stroke-width="4"/><text x="${X(k)}" y="${y - 60}" fill="${c}" font-size="30" font-family="Fraunces" font-weight="600" text-anchor="middle">${label}</text><text x="${X(k)}" y="${y + 80}" fill="${C.muted}" font-size="22" font-family="InterV" text-anchor="middle">${sub}</text></g>`;
    g += mark(.12, "accept_by", "the buyer pays", C.teal, .8) + mark(.45, "transfer_by", "+30 min grace", C.amber, 1.4) + mark(.85, "allowance_by", "the long stop", C.rose, 2.0);
    const head = `<div class="abs h" style="left:${px(120)};top:${px(150)};width:${px(1500)};font-size:${px(60)};${rise(t, .1, .5)}">Deadlines need no model.</div>`;
    const cards = `<div class="abs" style="left:${px(220)};top:${px(740)};width:${px(1480)};display:flex;gap:${px(30)}">
      <div class="panel" style="position:relative;flex:1;border-top-color:${C.amber};${rise(t, 2.4, 2.8)}"><div class="pt" style="font-size:${px(30)}">No transfer in time</div><div class="ps" style="font-size:${px(22)}">the buyer gets everything back</div></div>
      <div class="panel" style="position:relative;flex:1;border-top-color:${C.rose};${rise(t, 2.8, 3.2)}"><div class="pt" style="font-size:${px(30)}">No decision by the long stop</div><div class="ps" style="font-size:${px(22)}">what is left is split by the share agreed up front</div></div>
      <div class="panel" style="position:relative;flex:1;border-top-color:${C.teal};${rise(t, 3.2, 3.6)}"><div class="pt" style="font-size:${px(30)}">Pull payments</div><div class="ps" style="font-size:${px(22)}">each side withdraws its own credit</div></div></div>`;
    return waves(t) + head + `<svg class="abs" style="left:0;top:0" width="${W}" height="${H}" viewBox="0 0 1920 1080">${g}</svg>` + cards + cap("Anyone can call settle(): a dead page cannot lock the money.", t, dur, C.rose);
  },
  site(t, dur) {
    const bw = 1000, bh = 760, ih = bw * D.shot_ratio;
    const off = Math.max(0, (ih - bh)) * 0.55 * seg(t, .6, dur - .4);
    const inner = `<img src="${D.shot}" style="top:${px(-off)}">`;
    const br = `<div class="abs" style="left:${px(800)};top:${px(150)};perspective:${px(2200)};${op(t, 0, .4)}">${browser("claims.brilliantnodes.com", bw, bh, inner, `rotateY(${lerp(-24, -16, seg(t, 0, dur))}deg) rotateX(5deg)`)}</div>`;
    const left = `<div class="abs" style="left:${px(120)};top:${px(260)};width:${px(620)}"><div class="h" style="font-size:${px(58)};${rise(t, .1, .5)}">Every case and transaction, on the site.</div>
      <div style="font-size:${px(32)};color:${C.amber};font-weight:600;margin-top:${px(30)};${op(t, .5, .9)}">claims.brilliantnodes.com</div>
      <div class="muted" style="font-size:${px(25)};margin-top:${px(14)};line-height:1.35;${op(t, .7, 1.1)}">Each run's record, each deal's log, and a link to every transaction on the explorer.</div></div>`;
    return waves(t) + br + left;
  },
  end(t, dur) {
    const ros = `<div class="abs" style="left:${px(960 - 520)};top:${px(540 - 520)};width:${px(1040)};height:${px(1040)};opacity:.22;perspective:${px(1500)}"><div style="transform:rotateX(40deg) rotateZ(${t * 10}deg)">${rosette(1040, 1, 0, .01)}</div></div>`;
    const c = `<div class="abs" style="left:0;right:0;top:${px(300)};display:flex;flex-direction:column;align-items:center;text-align:center">
      <div class="h" style="font-size:${px(116)};${rise(t, .05, .45)}">ClaimEscrow</div>
      <div style="font-size:${px(36)};margin-top:${px(12)};${op(t, .3, .7)}">Claims trading settled from the public register, on GenLayer, by Brilliant Nodes</div>
      <div style="font-size:${px(38)};color:${C.amber};font-weight:600;margin-top:${px(44)};${op(t, .55, .95)}">claims.brilliantnodes.com</div>
      <div class="muted" style="font-size:${px(25)};margin-top:${px(12)};${op(t, .7, 1.1)}">github.com/brilliantnodes/claim-escrow</div></div>
      <div class="abs muted" style="left:0;right:0;bottom:${px(46)};text-align:center;font-size:${px(20)}">Fictional case, debtor and creditors; test GEN on GenLayer Studio. Not legal advice.</div>`;
    return ros + c;
  },
};

// Scene lengths the animations were drawn for. With a voice-over a scene lasts as long as its line, so its
// animation is stretched over that length: things keep moving while the line is spoken.
const BASE = {title: 4.5, problem: 6.0, register: 6.5, validators: 7.0, twice: 7.0, escrow: 7.5, cases: 8.0, deadlines: 6.0, site: 6.0, end: 4.0};
function draw(name, t, dur, fadeIn, fadeOut) {
  const base = BASE[name] || dur;
  const body = dur > base ? SCENES[name](t * base / dur, base) : SCENES[name](t, dur);
  const veil = Math.max(fadeIn ? 1 - clamp(t / .35) : 0, fadeOut ? clamp((t - (dur - .35)) / .35) : 0);
  S.innerHTML = (name === "end" || name === "title" ? "" : topbar()) + body + `<div id="veil" style="opacity:${veil}"></div>`;
  return Promise.all([...S.querySelectorAll("img")].map((im) => im.complete ? 0 : new Promise((r) => { im.onload = im.onerror = r; })));
}
</script></body></html>
